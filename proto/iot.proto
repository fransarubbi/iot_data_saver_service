syntax = "proto3";

package grpc;

service DataService {
  // Streaming Bidireccional
  rpc ConnectStream(stream FromDataSaver) returns (stream ToDataSaver);
}

// =================
// CARRIL DE SUBIDA
// =================
message FromDataSaver {
  oneof payload {
    Heartbeat heartbeat = 1;
  }
}

// =================
// CARRIL DE BAJADA
// =================
message ToDataSaver {
  oneof payload {
    Measurement measurement = 1;
    Monitor monitor = 2;
    SystemMetrics metric = 3;
    AlertAir alert_air = 4;
    AlertTh alert_th = 5;
    MeasurementBatch measurement_batch = 6;
    MonitorBatch monitor_batch = 7;
    AlertAirBatch alert_air_batch = 8;
    AlertThBatch alert_th_batch = 9;
  }
}

message Metadata {
  string sender_user_id = 1;
  string destination_id = 2;
  int64 timestamp = 3;
}

message Measurement {
  Metadata metadata = 1;
  string network = 2;
  float pulse_counter = 3;
  float temperature = 4;
  float humidity = 5;
  float air_quality = 6;
  uint32 sample = 7;
}

message AlertAir {
  Metadata metadata = 1;
  string network = 2;
  float initial_air_quality = 3;
  float actual_air_quality = 4;
}

message AlertTh {
  Metadata metadata = 1;
  string network = 2;
  float initial_temp = 3;
  float actual_temp = 4;
}

message Monitor {
  Metadata metadata = 1;
  string network = 2;
  uint32 heap_free = 3;
  uint32 heap_min_free = 4;
  uint32 heap_largest_block = 5;
  uint64 uptime_sec = 6;
}

message MeasurementBatch {
  repeated Measurement measurements = 1;
}

message MonitorBatch {
  repeated Monitor monitors = 1;
}

message AlertAirBatch {
  repeated AlertAir alerts = 1;
}

message AlertThBatch {
  repeated AlertTh alerts = 1;
}

message Heartbeat {
  Metadata metadata = 1;
  bool beat = 2;
}

message SystemMetrics {
  Metadata metadata = 1;
  uint64 uptime_seconds = 2;
  float cpu_usage_percent = 3;
  float cpu_temp_celsius = 4;
  uint64 ram_total_mb = 5;
  uint64 ram_used_by_service_mb = 6;
  uint64 ram_used_mb = 7;
  uint64 sd_total_gb = 8;
  uint64 sd_used_gb = 9;
  float sd_usage_percent = 10;
  uint64 network_rx_bytes = 11;
  uint64 network_tx_bytes = 12;
  int32 wifi_rssi = 13;
  int32 wifi_signal_dbm = 14;
}
